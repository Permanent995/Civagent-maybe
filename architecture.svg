<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a16207"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a21caf"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="940" fill="#ffffff"/>

  <text x="40" y="40" font-size="22" font-weight="bold" fill="#0f172a">CivAgent 目标架构图 — Unicv-RC 4.21.4 基线</text>
  <text x="40" y="64" font-size="12.5" fill="#64748b">依据 PLAN.md 第一次审查（2026-09-05）· 伏羲系 RAR（4.8.17）仅作钩子参照，不入架构 · 括号内为对应计划决策编号</text>

  <!-- ===== 玩家 A ===== -->
  <rect x="40" y="100" width="190" height="44" rx="8" fill="#f1f5f9" stroke="#475569"/>
  <text x="135" y="127" font-size="13.5" font-weight="bold" fill="#0f172a" text-anchor="middle">玩家 A（人类）</text>
  <line x1="135" y1="144" x2="135" y2="170" stroke="#475569" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <text x="143" y="163" font-size="10.5" fill="#64748b">操作</text>

  <!-- ===== 玩家 B ===== -->
  <rect x="40" y="560" width="190" height="44" rx="8" fill="#f1f5f9" stroke="#475569" stroke-dasharray="5,3"/>
  <text x="135" y="587" font-size="13.5" font-weight="bold" fill="#0f172a" text-anchor="middle">玩家 B（真人）</text>

  <!-- ===== RC 客户端 ===== -->
  <rect x="40" y="170" width="350" height="350" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="215" y="198" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">RC Unciv 客户端（jpackage）</text>
  <text x="215" y="218" font-size="11.5" fill="#475569" text-anchor="middle">Unciv-SongDynasty.exe · Unciv.jar 4.21.4-patch1</text>

  <rect x="56" y="232" width="318" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="215" y="251" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">席位互斥（决策 5.4）</text>
  <text x="215" y="268" font-size="11.5" fill="#334155" text-anchor="middle">Human ／ CivAgent（空位+房主勾选）／ Native AI</text>

  <rect x="56" y="286" width="318" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="215" y="305" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">游戏内控制台（RC 自带）</text>
  <text x="215" y="322" font-size="11.5" fill="#334155" text-anchor="middle">` 打开 · ConsoleCommandRoot · 增删改同指令树</text>

  <rect x="56" y="348" width="318" height="156" rx="6" fill="#ffffff" stroke="#c2410c" stroke-dasharray="5,3"/>
  <text x="215" y="368" font-size="12.5" font-weight="bold" fill="#9a3412" text-anchor="middle">Agent 钩子补丁（本计划新增，阶段 B/C）</text>
  <text x="68" y="390" font-size="11.5" fill="#334155">· localhost HTTP 指令入口（拆自 DevConsolePopup）</text>
  <text x="68" y="410" font-size="11.5" fill="#334155">· console_agent 白名单（仅外交合法动作）</text>
  <text x="68" y="430" font-size="11.5" fill="#334155">· NEED_POST 决策点（回合 / 外交）</text>
  <text x="68" y="450" font-size="11.5" fill="#334155">· next_turn / declare_war 事件上报</text>
  <text x="68" y="470" font-size="11.5" fill="#334155">· Options 内启用 Agent、填 AI 服地址</text>
  <text x="68" y="490" font-size="11.5" fill="#334155">· 多人局不锁控制台：按席位鉴权</text>

  <!-- ===== UncivServer ===== -->
  <rect x="470" y="170" width="270" height="110" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="605" y="200" font-size="14.5" font-weight="bold" fill="#14532d" text-anchor="middle">UncivServer.jar :8080</text>
  <text x="605" y="222" font-size="11.5" fill="#166534" text-anchor="middle">官方实现 · 与客户端同版本</text>
  <text x="605" y="240" font-size="11.5" fill="#166534" text-anchor="middle">仅做存档文件仓库（原版协议）</text>
  <text x="605" y="258" font-size="11.5" fill="#64748b" text-anchor="middle">不再用 Python 冒充联机服</text>

  <!-- ===== save_watcher ===== -->
  <rect x="470" y="380" width="270" height="120" rx="10" fill="#fefce8" stroke="#a16207" stroke-width="1.5"/>
  <text x="605" y="408" font-size="14.5" font-weight="bold" fill="#713f12" text-anchor="middle">save_watcher（薄旁路）</text>
  <text x="605" y="428" font-size="11.5" fill="#854d0e" text-anchor="middle">存档落地即差分抽取：</text>
  <text x="605" y="446" font-size="11.5" fill="#854d0e" text-anchor="middle">宣战/议和 · 贸易 · 科技 · 胜负</text>
  <text x="605" y="464" font-size="11.5" fill="#64748b" text-anchor="middle">无聊天 UGC，大陆公网也可用</text>

  <!-- ===== 总线 ===== -->
  <rect x="470" y="580" width="270" height="80" rx="10" fill="#fefce8" stroke="#a16207" stroke-width="1.5"/>
  <text x="605" y="608" font-size="14.5" font-weight="bold" fill="#713f12" text-anchor="middle">进程间总线（Redis 可替换）</text>
  <text x="605" y="628" font-size="11.5" fill="#854d0e" text-anchor="middle">只负责进程传话与热缓存</text>
  <text x="605" y="646" font-size="11.5" fill="#64748b" text-anchor="middle">不是 LLM 记忆（10 分钟 TTL 教训）</text>

  <!-- ===== ai_server ===== -->
  <rect x="830" y="170" width="410" height="330" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="1035" y="198" font-size="15" font-weight="bold" fill="#7c2d12" text-anchor="middle">ai_server（Python）:2335</text>
  <text x="1035" y="218" font-size="11.5" fill="#9a3412" text-anchor="middle">唯一常驻 AI 进程 · 端口进 config.yaml</text>

  <rect x="846" y="232" width="378" height="88" rx="6" fill="#ffffff" stroke="#fed7aa"/>
  <text x="1035" y="252" font-size="12.5" font-weight="bold" fill="#7c2d12" text-anchor="middle">决策与外交（继承 CivAgent 内核）</text>
  <text x="1035" y="272" font-size="11.5" fill="#431407" text-anchor="middle">封闭动作空间：intention_space / skill_space</text>
  <text x="1035" y="290" font-size="11.5" fill="#431407" text-anchor="middle">性格开局锁模板，局内仅事件驱动滑动一格</text>
  <text x="1035" y="308" font-size="11.5" fill="#431407" text-anchor="middle">观察按战争迷雾裁剪，只读本文明切片</text>

  <rect x="846" y="330" width="378" height="76" rx="6" fill="#ffffff" stroke="#fed7aa"/>
  <text x="1035" y="350" font-size="12.5" font-weight="bold" fill="#7c2d12" text-anchor="middle">记忆分层（决策 5.1）</text>
  <text x="1035" y="370" font-size="11.5" fill="#431407" text-anchor="middle">策略记忆：每回合存档事件 → prompt（必做）</text>
  <text x="1035" y="388" font-size="11.5" fill="#431407" text-anchor="middle">对话记忆：按合规档写本机文件（可关）</text>

  <rect x="846" y="416" width="378" height="68" rx="6" fill="#ffffff" stroke="#fed7aa"/>
  <text x="1035" y="436" font-size="12.5" font-weight="bold" fill="#7c2d12" text-anchor="middle">技能阈值 / 评测（决策 6.1）</text>
  <text x="1035" y="456" font-size="11.5" fill="#431407" text-anchor="middle">调 skill_space 阈值、记忆抽取，不微调大模型</text>
  <text x="1035" y="474" font-size="11.5" fill="#431407" text-anchor="middle">bargain / cheat 脚本当回归</text>

  <!-- ===== LLM ===== -->
  <rect x="830" y="580" width="410" height="80" rx="10" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="1035" y="608" font-size="14.5" font-weight="bold" fill="#701a75" text-anchor="middle">LLM API（云端 / 本地 Ollama）</text>
  <text x="1035" y="628" font-size="11.5" fill="#86198f" text-anchor="middle">每回合有限次结构化工具调用：短输出、可校验</text>
  <text x="1035" y="646" font-size="11.5" fill="#86198f" text-anchor="middle">物理不变量由工具校验（amount ≤ treasury 等）</text>

  <!-- ===== 连线 ===== -->
  <!-- 3 存档同步 -->
  <line x1="390" y1="215" x2="470" y2="215" stroke="#1d4ed8" stroke-width="2" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <text x="430" y="200" font-size="10.5" fill="#1d4ed8" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">③ 存档同步</text>

  <!-- 1 决策请求 -->
  <line x1="390" y1="320" x2="830" y2="320" stroke="#c2410c" stroke-width="2" marker-end="url(#arrOrange)"/>
  <text x="600" y="308" font-size="11" fill="#c2410c" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">① 决策请求 NEED_POST（游戏状态摘要）</text>

  <!-- 2 白名单指令 -->
  <line x1="830" y1="352" x2="390" y2="352" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrRed)"/>
  <text x="600" y="368" font-size="11" fill="#b91c1c" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">② 白名单控制台指令（执行）</text>

  <!-- 4a watcher -> bus -->
  <line x1="605" y1="500" x2="605" y2="580" stroke="#a16207" stroke-width="2" marker-end="url(#arrAmber)"/>
  <text x="615" y="545" font-size="10.5" fill="#a16207" paint-order="stroke" stroke="#ffffff" stroke-width="4">④ 结构化事件</text>

  <!-- 4b bus -> ai_server -->
  <path d="M 740,620 L 785,620 L 785,440 L 830,440" fill="none" stroke="#a16207" stroke-width="2" marker-end="url(#arrAmber)"/>
  <text x="792" y="548" font-size="10.5" fill="#a16207" paint-order="stroke" stroke="#ffffff" stroke-width="4">④ 注入观察</text>

  <!-- 5 ai_server <-> LLM -->
  <line x1="1035" y1="500" x2="1035" y2="580" stroke="#a21caf" stroke-width="2" marker-start="url(#arrPurple)" marker-end="url(#arrPurple)"/>
  <text x="1045" y="545" font-size="10.5" fill="#a21caf" paint-order="stroke" stroke="#ffffff" stroke-width="4">⑤ 工具调用/返回</text>

  <!-- 6 玩家B -> server -->
  <path d="M 230,582 L 420,582 L 420,270 L 470,270" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrGray)"/>
  <text x="300" y="572" font-size="10.5" fill="#64748b" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">⑥ 玩家 B 连同一存档服</text>

  <!-- ===== 底部注释带 ===== -->
  <rect x="40" y="700" width="590" height="180" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="60" y="728" font-size="14" font-weight="bold" fill="#0f172a">执行链与三层权限（决策 6.4）</text>
  <text x="60" y="754" font-size="11.5" fill="#334155">LLM → 结构化意图 → 白名单控制台字符串 / 引擎动作 → 身份校验 → 写回</text>
  <text x="60" y="780" font-size="11.5" fill="#334155">看：本文明战争迷雾切片（禁上帝视角全文存档、禁他人私聊）</text>
  <text x="60" y="804" font-size="11.5" fill="#334155">说：外交文本；「给我钱」只能是贸易提案，由引擎过账</text>
  <text x="60" y="828" font-size="11.5" fill="#334155">做：console_agent 白名单（禁 civ addstat / unit add / city setpop）</text>
  <text x="60" y="852" font-size="11.5" fill="#64748b">console_gm 全指令仅限本机开发者；建造/科研由引擎扣款，不走控制台</text>

  <rect x="660" y="700" width="580" height="180" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="680" y="728" font-size="14" font-weight="bold" fill="#0f172a">聊天三档（决策 5.3）— Agent 决策不依赖聊天</text>
  <text x="680" y="756" font-size="11.5" fill="#334155">off：大陆公网默认 · 无输入框 · 不存玩家原话</text>
  <text x="680" y="782" font-size="11.5" fill="#334155">local：单机 / 局域网 · 对话日志只在本机磁盘</text>
  <text x="680" y="808" font-size="11.5" fill="#334155">relay：全球节点 · 服务器转发 · 按当地隐私政策</text>
  <text x="680" y="834" font-size="11.5" fill="#64748b">满员全真人局：Agent 全席静默，不旁观、不记录（决策 5.4）</text>
  <text x="680" y="860" font-size="11.5" fill="#64748b">关掉聊天，Agent 仍按存档事件「记得」宣战与毁约</text>

  <text x="40" y="916" font-size="10.5" fill="#94a3b8">CivAgent 架构向量图 · 2026-09-05 · 基线：Unicv-RC 4.21.4-patch1（源码 Unciv-Source @ 5e7c5dd2e + 发行包 Unicv-RC-1.0-win64.zip）</text>
</svg>
